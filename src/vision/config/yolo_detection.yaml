# YOLO detection configuration for Tank Challenge /detect endpoint.
# 0615 final model is filtered to runtime classes: car, tank, rock, house.
model:
  default_filename: best_final.engine
  imgsz: 416
  iou: 0.70
  max_det: 20
  max_return: 5
  model_confidence: 0.10
  enable_cache: true
  min_interval_sec: 0.12
  half_if_cuda: true
  warmup_runs: 2

tracking:
  # Fusion/discovered-map 중복 방지는 trackId가 아니라 tank_map 좌표 기준으로 처리한다.
  # 따라서 frame 끊김/지연 진단 단계에서는 tracking을 OFF한다.
  enabled: false
  tracker: bytetrack.yaml
  persist: false

classes:
  canonical:
    - car
    - tank
    - rock
    - house
  fixed_ids:
    car: 0
    tank: 2
    rock: 3
    house: 4
  aliases:
    Tank: tank
    tank: tank
    rock: rock
    house: house
    car: car
  default_box_color: '#00FF00'
  colors:
    rock: '#FFA500'
    tank: '#FF0000'
    car: '#FF66CC'
    house: '#AA66FF'
  default_confidence: 0.20
  confidence_thresholds:
    tank: 0.25

bbox_distance:
  enabled: false
  publish_metadata: false

runtime:
  recognition_log: false
  recognition_log_cache: false
  recognition_log_empty: false
  timing_log: false
  debug_detections: false
